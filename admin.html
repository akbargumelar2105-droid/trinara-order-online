<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#183d32"><title>Admin Trinara</title>
<style>
:root{--green:#183d32;--green2:#245444;--cream:#f7f2e8;--paper:#fffdf8;--yellow:#e9bd50;--ink:#202923;--muted:#778078;--line:#e8e2d7;--red:#a74335}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.top{background:var(--green);color:white;padding:18px 20px}.topin{max-width:850px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:900;letter-spacing:2px}.brand small{display:block;font-size:10px;font-weight:500;color:#d8dfd9;margin-top:3px}.wrap{max-width:850px;margin:24px auto;padding:0 16px 50px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px}.panel h1,.panel h2{margin:0 0 8px;font-family:Georgia,serif}.muted{color:var(--muted);font-size:13px}.field{display:flex;flex-direction:column;gap:6px;margin:13px 0}.field label{font-size:12px;font-weight:800}.field input{border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;width:100%}button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:11px 14px;font-weight:800}.primary{background:var(--green);color:white;width:100%}.logout{background:#ffffff20;color:white;border:1px solid #ffffff55}.toggle{background:#f5e2df;color:#913b30}.toggle.on{background:#e8f1e9;color:#245444}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.name{font-weight:800;font-size:14px}.state{font-size:11px;color:var(--muted);margin-top:4px}.msg{padding:11px;border-radius:10px;font-size:13px;margin-top:12px;display:none}.msg.show{display:block}.error{background:#fff0ed;color:#963c30}.success{background:#e8f1e9;color:#245444}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:14px 0}.toolbar input{flex:1;min-width:150px;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit}.hidden{display:none!important}.footer{text-align:center;color:var(--muted);font-size:11px;padding:15px}
</style></head><body>
<header class="top"><div class="topin"><div class="brand">TRINARA<small>ADMIN · MENU AVAILABILITY</small></div><button id="logout" class="logout hidden">Keluar</button></div></header>
<main class="wrap"><section id="loginPanel" class="panel"><h1>Login Admin</h1><p class="muted">Masuk menggunakan akun admin Trinara.</p><form id="loginForm"><div class="field"><label>Email admin</label><input id="email" type="email" autocomplete="username" required placeholder="Email admin"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required placeholder="Password"></div><button class="primary" type="submit">Masuk</button></form><div id="loginMsg" class="msg error"></div></section>
<section id="dashboard" class="hidden"><div class="panel"><h1>Ketersediaan Menu</h1><p class="muted">Tekan tombol di samping menu untuk mengubah status. Perubahan akan terlihat di website pelanggan dalam beberapa detik.</p><div class="toolbar"><input id="search" placeholder="Cari nama menu…"><span id="count" class="muted"></span></div><div id="menuList">Memuat menu…</div><div id="dashMsg" class="msg"></div></div></section></main><footer class="footer">TRINARA RESTAURANT & CAFE</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='https://rewhoemzpyklbnnvtwwi.supabase.co';const SUPABASE_KEY='sb_publishable_LAgei6P4KyZI-2LAWOXgmg_igKc3vqc';const ADMIN_UID='40d17670-aec3-4035-b8f6-6a37e570ca9c';const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const loginPanel=document.getElementById('loginPanel'),dashboard=document.getElementById('dashboard'),loginMsg=document.getElementById('loginMsg'),dashMsg=document.getElementById('dashMsg');let menuRows=[];
function message(el,text,kind='error'){el.textContent=text;el.className='msg show '+kind;}
function showDashboard(user){if(!user||user.id!==ADMIN_UID){message(loginMsg,'Akun ini tidak memiliki akses admin Trinara.');return;}loginPanel.classList.add('hidden');dashboard.classList.remove('hidden');document.getElementById('logout').classList.remove('hidden');loadRows();}
async function loadRows(){document.getElementById('menuList').textContent='Memuat menu…';const {data,error}=await db.from('menu_items').select('id,name,available').order('name');if(error){document.getElementById('menuList').textContent='Gagal memuat menu: '+error.message;return;}menuRows=data||[];renderRows();}
function renderRows(){const q=document.getElementById('search').value.toLowerCase();const rows=menuRows.filter(x=>x.name.toLowerCase().includes(q));document.getElementById('count').textContent=rows.length+' menu';document.getElementById('menuList').innerHTML=rows.map(x=>`<div class="row"><div><div class="name">${x.name}</div><div class="state">${x.available?'Tersedia':'Habis'}</div></div><button class="toggle ${x.available?'on':''}" onclick="toggleMenu('${x.id}')">${x.available?'Tandai Habis':'Aktifkan'}</button></div>`).join('')||'<p class="muted">Menu tidak ditemukan.</p>';}
async function toggleMenu(id){const item=menuRows.find(x=>x.id===id);if(!item)return;const btns=document.querySelectorAll('button.toggle');btns.forEach(b=>b.disabled=true);const {data,error}=await db.from('menu_items').update({available:!item.available,updated_at:new Date().toISOString()}).eq('id',id).select('id,name,available').single();btns.forEach(b=>b.disabled=false);if(error){message(dashMsg,'Gagal mengubah status. Pastikan akun admin dan kebijakan database benar. '+error.message);return;}menuRows=menuRows.map(x=>x.id===id?data:x);message(dashMsg,`${data.name}: ${data.available?'sekarang tersedia':'ditandai habis'}.`,'success');renderRows();}
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();loginMsg.className='msg';const {data,error}=await db.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error){message(loginMsg,'Login gagal. Periksa email dan password.');return;}if(data.user.id!==ADMIN_UID){await db.auth.signOut();message(loginMsg,'Akun ini bukan admin Trinara.');return;}showDashboard(data.user);});
document.getElementById('logout').addEventListener('click',async()=>{await db.auth.signOut();location.reload();});document.getElementById('search').addEventListener('input',renderRows);
db.auth.getSession().then(({data})=>{if(data.session)showDashboard(data.session.user);});
</script></body></html>
