<style>

utton{white-space:nowrap;border:1px solid var(--line);background:var(--paper);color:#566158;padding:9px 14px;border-radius:30px;font-size:12px;font-weight:700}.tabs button.active{background:var(--green);color:white;border-color:var(--green)}.section-title{font-family:Georgia,serif;font-size:23px;margin:13px 0}.menu-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.item{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}.item h3{font-size:14px;margin:0;line-height:1.35}.item .desc{font-size:11px;color:var(--muted);min-height:14px}.price-row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto}.price{font-weight:800;color:var(--green);font-size:15px}.item select{width:100%;border:1px solid var(--line);background:white;border-radius:9px;padding:8px;font-size:12px}.add{border:0;background:var(--yellow);color:#302710;border-radius:10px;padding:9px 12px;font-size:12px;font-weight:800}.add:hover{filter:brightness(.96)}.cart{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:17px;height:max-content;position:sticky;top:15px}.cart h2{font-family:Georgia,serif;font-size:22px;margin:0 0 4px}.sub{color:var(--muted);font-size:11px}.empty{padding:26px 5px;text-align:center;color:var(--muted);font-size:13px}.cart-list{display:flex;flex-direction:column;gap:12px;margin:15px 0}.cart-line{border-bottom:1px solid var(--line);padding-bottom:11px}.line-top{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:700}.line-sub{display:flex;justify-content:space-between;align-items:center;margin-top:8px}.qty{display:flex;align-items:center;gap:9px}.qty button{width:25px;height:25px;border:1px solid var(--line);border-radius:7px;background:white}.totals{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px;font-size:13px}.total{font-size:17px;font-weight:900;color:var(--green)}.field{display:flex;flex-direction:column;gap:5px;margin:11px 0}.field label{font-size:11px;font-weight:800;color:#4b574f}.field input,.field select,.field textarea{border:1px solid var(--line);background:white;border-radius:10px;padding:11px 12px;outline:none;width:100%;font-size:13px}.field textarea{resize:vertical;min-height:65px}.checkout{width:100%;background:var(--green);color:white;border:0;padding:14px;border-radius:12px;font-weight:800;margin-top:13px}.checkout:disabled{opacity:.45;cursor:not-allowed}.hint{font-size:11px;line-height:1.5;color:var(--muted);margin:8px 0}.notice{display:none;background:#fff3e6;border:1px solid #f0d4ad;color:#795125;padding:10px;border-radius:10px;font-size:11px;line-height:1.5;margin:10px 0}.notice.show{display:block}.foot{text-align:center;color:var(--muted);font-size:11px;padding:20px}.pill{display:inline-block;background:#edf2ec;color:var(--green);font-size:10px;padding:4px 7px;border-radius:20px;margin-top:5px}.mobile-cart{display:none}
@media(max-width:800px){.wrap{grid-template-columns:1fr}.cart{position:static}.menu-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.topin{align-items:flex-start}.status{font-size:10px}.mobile-cart{display:block;position:fixed;bottom:12px;left:14px;right:14px;z-index:5;background:var(--green);color:white;border:0;border-radius:14px;padding:14px;font-weight:800;box-shadow:0 8px 28px #0003}.cart{margin-bottom:45px}}
@media(max-width:430px){.menu-grid{grid-template-columns:1fr 1fr}.item{padding:11px}.item h3{font-size:12px}.price{font-size:13px}.hero-card{padding:23px}.brand h1{font-size:17px}}
